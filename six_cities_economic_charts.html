      { name: "芝加哥都会区名义家庭收入（$35,200→$98,500，涨2.80倍）", short: "2026名义收入", color: "#7c3aed", data: [100, 119, 146, 162, 174, 171, 192, 221, 226, 261, 280] },

let currentCityKey = "taiyuan";
let w1 = 0.40, w2 = 0.25, w3 = 0.35;

function initTabs() {
  const container = document.getElementById("cityTabs");
  container.innerHTML = "";
  Object.keys(CITIES).forEach(key => {
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (key === currentCityKey ? " active" : "");
    btn.textContent = CITIES[key].name;
    btn.onclick = () => {
      currentCityKey = key;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderAll();
    };
    container.appendChild(btn);
  });
}

function computeUtilitySeries(cityObj) {
  const cpi = cityObj.series1[0].data;
  const house = cityObj.series1[1].data;
  const inc = cityObj.series1[2].data;
  const food1 = cityObj.series1[3].data;
  const food2 = cityObj.series1[4].data;
  const food3 = cityObj.series1[5].data;

  // 工业科技与一般消费品：名义收入 / 科技加权平减指数（工业科技品37年相对大幅降价）
  const techFactor = [1.0, 0.92, 0.78, 0.62, 0.54, 0.49, 0.41, 0.36, 0.35, 0.34, 0.33];
  const genPower = YEARS.map((_, i) => {
    const deflator = (cpi[i] / 100) * techFactor[i];
    return Math.round((inc[i] / deflator) * 10) / 10;
  });

  const housePower = YEARS.map((_, i) => {
    return Math.round(((inc[i] / house[i]) * 100) * 10) / 10;
  });

  const foodPower = YEARS.map((_, i) => {
    const avgFood = (food1[i] + food2[i] + food3[i]) / 3;
    return Math.round(((inc[i] / avgFood) * 100) * 10) / 10;
  });

  const totalUtility = YEARS.map((_, i) => {
    const u = Math.pow(genPower[i], w1) * Math.pow(housePower[i], w2) * Math.pow(foodPower[i], w3);
    return Math.round(u * 10) / 10;
  });

  const pct = (arr) => {
    const p = ((arr[arr.length - 1] - 100)).toFixed(1);
    return (p >= 0 ? "+" : "") + p + "%";
  };

  return [
    { name: `一般消费品与工业科技购买力（权重${Math.round(w1*100)}%，${pct(genPower)}）`, short: "一般消费与科技", color: "#2563eb", data: genPower },
    { name: `住房面积购买力（权重${Math.round(w2*100)}%，${pct(housePower)}）`, short: "住房购买力", color: "#d97706", data: housePower },
    { name: `综合真实生活水平指数（Cobb-Douglas总效用，${pct(totalUtility)}）`, short: "综合生活水平", color: "#7c3aed", isMain: true, data: totalUtility },
    { name: `饮食餐饮购买力（权重${Math.round(w3*100)}%，${pct(foodPower)}）`, short: "饮食购买力", color: "#c026d3", data: foodPower }
  ];
}

function renderKPIs(cityObj, uSeries) {
  const strip = document.getElementById("kpiStrip");
  const totalU = uSeries[2].data[uSeries[2].data.length - 1];
  const diffPct = ((totalU - 100)).toFixed(1);
  const mult = (totalU / 100).toFixed(2);

  const cards = [
    cityObj.kpis[0],
    cityObj.kpis[1],
    cityObj.kpis[2],
    {
      label: "当前权重下·综合真实生活水平",
      val: `${totalU} (${mult}倍)`,
      note: `较1990年基准变化 ${diffPct >= 0 ? "+" : ""}${diffPct}%`
    }
  ];

  strip.innerHTML = cards.map(c => `
    <div class="kpi-box">
      <div class="kpi-label">${c.label}</div>
      <div class="kpi-val">${c.val}</div>
      <div class="kpi-note">${c.note}</div>
    </div>
  `).join("");
}

function drawLineChart(svgId, seriesList, yAxisTitle, isUtilityChart = false) {
  const svg = document.getElementById(svgId);
  const W = 960, H = isUtilityChart ? 470 : 500;
  const pad = { top: 36, right: 155, bottom: 52, left: 78 };
  const plotW = W - pad.left - pad.right;
  const plotH = H - pad.top - pad.bottom;

  let maxVal = 0;
  seriesList.forEach(s => s.data.forEach(v => { if (v > maxVal) maxVal = v; }));
  const niceMax = Math.ceil((maxVal * 1.12) / 50) * 50;

  const xScale = (year) => pad.left + ((year - 1990) / (2026 - 1990)) * plotW;
  const yScale = (val) => pad.top + plotH - (val / niceMax) * plotH;

  let html = `<rect x="0" y="0" width="${W}" height="${H}" fill="#ffffff"/>`;

  // 水平网格线
  const tickCount = 6;
  for (let i = 0; i <= tickCount; i++) {
    const val = Math.round((niceMax / tickCount) * i);
    const y = yScale(val);
    html += `<line x1="${pad.left}" y1="${y}" x2="${W - pad.right}" y2="${y}" stroke="#e5e7eb" stroke-width="1"/>`;
    html += `<text x="${pad.left - 10}" y="${y + 4}" text-anchor="end" font-size="12" fill="#6b7280">${val.toLocaleString()}</text>`;
  }

  // 垂直年份网格线
  const xTicks = [1990, 1995, 2000, 2005, 2010, 2015, 2020, 2025];
  xTicks.forEach(yr => {
    const x = xScale(yr);
    html += `<line x1="${x}" y1="${pad.top}" x2="${x}" y2="${pad.top + plotH}" stroke="#e5e7eb" stroke-width="1"/>`;
    html += `<text x="${x}" y="${pad.top + plotH + 22}" text-anchor="middle" font-size="12.5" fill="#4b5563">${yr}</text>`;
  });

  // 坐标轴标题
  html += `<text x="${pad.left + plotW / 2}" y="${H - 10}" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">年份 (Year)</text>`;
  html += `<text x="20" y="${pad.top + plotH / 2}" text-anchor="middle" font-size="13" font-weight="600" fill="#374151" transform="rotate(-90, 20, ${pad.top + plotH / 2})">${yAxisTitle}</text>`;

  // 1990 起点标注
  const y100 = yScale(100);
  html += `<circle cx="${xScale(1990)}" cy="${y100}" r="4.5" fill="#111827"/>`;
  html += `<text x="${xScale(1990) + 8}" y="${y100 + 16}" font-size="12" font-weight="600" fill="#374151">1990共同起点 (100)</text>`;

  // 收集终点标签用于防重叠调整
  const endLabels = seriesList.map((s, idx) => {
    const lastVal = s.data[s.data.length - 1];
    return {
      idx,
      y: yScale(lastVal),
      text: `${s.short}: ${Math.round(lastVal)}`,
      color: s.color
    };
  }).sort((a, b) => a.y - b.y);

  for (let i = 1; i < endLabels.length; i++) {
    if (endLabels[i].y - endLabels[i - 1].y < 16) {
      endLabels[i].y = endLabels[i - 1].y + 16;
    }
  }

  // 绘制折线与数据点
  seriesList.forEach((s, sIdx) => {
    const pts = YEARS.map((yr, i) => `${xScale(yr).toFixed(1)},${yScale(s.data[i]).toFixed(1)}`).join(" ");
    const strokeW = s.isMain || sIdx === 2 ? 3.2 : 2.5;
    html += `<polyline fill="none" stroke="${s.color}" stroke-width="${strokeW}" stroke-linecap="round" stroke-linejoin="round" points="${pts}"/>`;

    if (s.peakIdx !== undefined && s.peakLabel) {
      const px = xScale(YEARS[s.peakIdx]);
      const py = yScale(s.data[s.peakIdx]);
      html += `<circle cx="${px}" cy="${py}" r="4.5" fill="${s.color}" stroke="#fff" stroke-width="1.5"/>`;
      html += `<text x="${px}" y="${py - 10}" text-anchor="middle" font-size="11.5" font-weight="700" fill="${s.color}">${s.peakLabel}</text>`;
    }

    YEARS.forEach((yr, i) => {
      const cx = xScale(yr);
      const cy = yScale(s.data[i]);
      html += `<circle cx="${cx}" cy="${cy}" r="3.5" fill="${s.color}" stroke="#fff" stroke-width="1.2"
        onmouseenter="showTip(event, ${yr}, '${s.short}', ${s.data[i]}, '${s.color}')"
        onmouseleave="hideTip()" style="cursor:pointer;"/>`;
    });
  });

  // 绘制右侧终点标签
  const xEnd = xScale(2026) + 8;
  endLabels.forEach(lbl => {
    html += `<text x="${xEnd}" y="${lbl.y + 4}" font-size="12" font-weight="700" fill="${lbl.color}">${lbl.text}</text>`;
  });

  svg.innerHTML = html;
}

function showTip(evt, year, name, val, color) {
  const tip = document.getElementById("tooltip");
  const mult = (val / 100).toFixed(2);
  tip.innerHTML = `
    <div style="font-weight:700;margin-bottom:4px;border-bottom:1px solid rgba(255,255,255,0.15);padding-bottom:3px;">${CITIES[currentCityKey].name} · ${year} 年</div>
    <div><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color};margin-right:6px;"></span>${name}</div>
    <div style="margin-top:3px;font-size:13.5px;font-weight:700;">指数：${val} <span style="font-weight:400;font-size:11.5px;color:#d1d5db;">(1990年的 ${mult} 倍)</span></div>
  `;
  tip.style.display = "block";
  tip.style.left = Math.min(window.innerWidth - 220, evt.clientX + 14) + "px";
  tip.style.top = (evt.clientY - 16) + "px";
}

function hideTip() {
  document.getElementById("tooltip").style.display = "none";
}

function renderAll() {
  const cityObj = CITIES[currentCityKey];
  const uSeries = computeUtilitySeries(cityObj);

  document.getElementById("chart1Title").textContent = `${cityObj.name}城镇收入、住宅房价、三类餐饮与CPI 37年累计增长指数全景对比（1990年 = 100）`;
  document.getElementById("chart1Sub").textContent = cityObj.note;
  document.getElementById("legend1").innerHTML = cityObj.series1.map(s => `
    <div class="legend-item">
      <span class="legend-swatch" style="background:${s.color}"></span>
      <span>${s.name}</span>
    </div>
  `).join("");

  document.getElementById("chart2Title").textContent = `${cityObj.name}城镇居民“真实生活水平效用模型”量化测算（1990年 = 100）`;
  document.getElementById("chart2Sub").textContent = `基于 Cobb-Douglas 效用函数动态合成（当前权重：一般消费与科技 ${Math.round(w1*100)}% / 住房 ${Math.round(w2*100)}% / 饮食 ${Math.round(w3*100)}%）`;
  document.getElementById("legend2").innerHTML = uSeries.map(s => `
    <div class="legend-item">
      <span class="legend-swatch" style="background:${s.color}"></span>
      <span>${s.name}</span>
    </div>
  `).join("");

  renderKPIs(cityObj, uSeries);
  drawLineChart("svg1", cityObj.series1, "累计增长指数 (1990年=100)", false);
  drawLineChart("svg2", uSeries, "真实购买力指数 (1990年=100)", true);
}

// 权重滑块联动
const s1 = document.getElementById("w1Slider");
const s2 = document.getElementById("w2Slider");
const s3 = document.getElementById("w3Slider");

function updateWeights() {
  let v1 = parseInt(s1.value, 10);
  let v2 = parseInt(s2.value, 10);
  if (v1 + v2 > 95) {
    v2 = 95 - v1;
    s2.value = v2;
  }
  let v3 = 100 - v1 - v2;
  s3.value = v3;
  w1 = v1 / 100;
  w2 = v2 / 100;
  w3 = v3 / 100;
  document.getElementById("w1Val").textContent = v1 + "%";
  document.getElementById("w2Val").textContent = v2 + "%";
  document.getElementById("w3Val").textContent = v3 + "%";
  renderAll();
}
s1.addEventListener("input", updateWeights);
s2.addEventListener("input", updateWeights);

// 高清 PNG 导出
function exportSVG(svgId, suffix) {
  const svgEl = document.getElementById(svgId);
  const serializer = new XMLSerializer();
  const svgStr = serializer.serializeToString(svgEl);
  const svgBlob = new Blob([svgStr], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  img.onload = function() {
    const scale = 2;
    const canvas = document.createElement("canvas");
    canvas.width = 960 * scale;
    canvas.height = (suffix === "chart1" ? 500 : 470) * scale;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);
    const a = document.createElement("a");
    a.download = `${CITIES[currentCityKey].en}_${suffix}_1990_2026.png`;
    a.href = canvas.toDataURL("image/png");
    a.click();
  };
  img.src = url;
}

initTabs();
renderAll();
